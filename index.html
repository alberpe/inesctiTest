<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Colorea</title>
<style>
:root{--u:6px;--ink:#3b2a1e;--hi:#ffc83d}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;position:fixed;background:#2b6a22 radial-gradient(ellipse at 50% 0%,#c5e66a 0%,#5aa634 40%,#2b6a22 100%);font-family:"Trebuchet MS",Arial,sans-serif;color:var(--ink)}
#app{display:flex;flex-direction:row;align-items:center;width:100%;height:100%;padding:calc(var(--u)*1.5)}
.col{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff7e0;border:calc(var(--u)*.7) solid #8b5a2b;border-radius:calc(var(--u)*4);padding:calc(var(--u)*1);box-shadow:0 calc(var(--u)*.7) 0 rgba(20,50,15,.45)}
#tools{height:100%}
#pal{height:100%;flex-direction:row;flex-shrink:0}
.pc{display:flex;flex-direction:column;justify-content:center}
button{font-family:inherit;border:0;padding:0;margin:0;cursor:pointer;color:var(--ink)}
.big{width:calc(var(--u)*11);height:calc(var(--u)*11);margin:calc(var(--u)*.5);border-radius:calc(var(--u)*3);background:#eee;font-size:calc(var(--u)*6);line-height:1;border:calc(var(--u)*.6) solid #fff7e0;-webkit-transition:-webkit-transform .1s;transition:transform .1s}
.big:active,.sw:active{-webkit-transform:scale(.9);transform:scale(.9)}
#t-brush{background:#ff7a45}#t-fill{background:#3fb6ea}#t-erase{background:#b87be6}#undo{background:#b9763f}
.big.on{border-color:#fff;box-shadow:0 0 0 calc(var(--u)*.8) var(--ink);-webkit-transform:scale(1.1);transform:scale(1.1)}
.sz{width:calc(var(--u)*8);height:calc(var(--u)*7);margin:calc(var(--u)*.3);border-radius:calc(var(--u)*2);background:#e3f2c4;border:calc(var(--u)*.5) solid #e3f2c4;display:flex;align-items:center;justify-content:center}
.sz i{display:block;background:var(--ink);border-radius:50%}
.sz.on{background:var(--hi);border-color:var(--ink)}
#open{font-size:calc(var(--u)*4.5);line-height:1;margin-top:calc(var(--u)*1);background:#ffb43a;border-color:#ffb43a}
.sw{width:calc(var(--u)*10);height:calc(var(--u)*10);margin:calc(var(--u)*.6);border-radius:50%;border:calc(var(--u)*.6) solid #fff7e0;box-shadow:0 0 0 calc(var(--u)*.4) rgba(59,42,30,.35)}
.sw.on{box-shadow:0 0 0 calc(var(--u)*.9) var(--ink);-webkit-transform:scale(1.12);transform:scale(1.12)}
#center{flex:1;height:100%;display:flex;align-items:center;justify-content:center;position:relative;min-width:0}
#stage{position:relative;background:#fff;border:calc(var(--u)*1) solid #ffb43a;border-radius:calc(var(--u)*3);overflow:hidden;box-shadow:0 calc(var(--u)*.7) 0 rgba(20,50,15,.45)}
#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#art{pointer-events:none}

/* selector de imagen */
#pick{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(20,50,15,.65);display:none;align-items:center;justify-content:center;z-index:9}
#pick.open{display:flex}
#box{background:#fff7e0;border:calc(var(--u)*.8) solid #8b5a2b;border-radius:calc(var(--u)*4);padding:calc(var(--u)*3);width:90%;max-width:calc(var(--u)*110);max-height:calc(var(--u)*92);display:flex;flex-direction:column}
#menu{display:flex;flex-direction:row;justify-content:center}
.opt{flex:1;margin:calc(var(--u)*1);padding:calc(var(--u)*3) calc(var(--u)*1);border-radius:calc(var(--u)*3);background:#eef6ff;border:calc(var(--u)*.6) solid #c9d9ef;font-size:calc(var(--u)*4);font-weight:700}
#o-gal{background:#c9ecfb;border-color:#2fa8e0}#o-def{background:#efdcfb;border-color:#a65fd6}
.opt span{display:block;font-size:calc(var(--u)*14);line-height:1.2}
.opt:active{-webkit-transform:scale(.96);transform:scale(.96)}
#defs{display:none;flex-direction:column;min-height:0}
#defs.show{display:flex}
#grid{display:flex;flex-wrap:wrap;justify-content:center;overflow-y:auto;-webkit-overflow-scrolling:touch}
.def{width:calc(50% - 16px);margin:8px;background:#fffdf5;border:calc(var(--u)*.6) solid #c9a36b;border-radius:calc(var(--u)*2);padding:6px;font-size:calc(var(--u)*3.5);font-weight:700}
.def canvas,.def img{width:100%;height:auto;display:block}
.def:active{-webkit-transform:scale(.96);transform:scale(.96)}
#msg{min-height:1em;font-size:calc(var(--u)*3);text-align:center;color:#e53935}
#close{align-self:center;margin-top:calc(var(--u)*1);padding:calc(var(--u)*1.5) calc(var(--u)*5);border-radius:calc(var(--u)*3);background:#ffb43a;border:calc(var(--u)*.5) solid #e59a1f;font-size:calc(var(--u)*3.8);font-weight:700}
#err{position:fixed;left:0;right:0;top:0;background:#e53935;color:#fff;font:14px Arial;padding:6px 10px;z-index:99}
</style>
</head>
<body>
<div id="app">
  <div id="tools" class="col">
    <button class="big on" id="t-brush" aria-label="Pincel">🖌️</button>
    <button class="big" id="t-fill" aria-label="Bote de pintura">🪣</button>
    <button class="big" id="t-erase" aria-label="Goma">🧽</button>
    <button class="big" id="undo" aria-label="Deshacer">↩️</button>
    <div id="sizes"></div>
    <button class="sz" id="open" aria-label="Cargar imagen">🖼️</button>
  </div>
  <div id="center"><div id="stage"><canvas id="paint"></canvas><canvas id="art"></canvas></div></div>
  <div id="pal" class="col"><div class="pc" id="p1"></div><div class="pc" id="p2"></div></div>
</div>

<input type="file" id="file" accept="image/*" style="position:fixed;left:0;top:0;width:1px;height:1px;opacity:0" tabindex="-1" aria-hidden="true">

<div id="pick"><div id="box">
  <div id="menu">
    <button class="opt" id="o-gal"><span>📁</span>Galería</button>
    <button class="opt" id="o-def"><span>🎨</span>Dibujos</button>
  </div>
  <div id="defs"><div id="grid"></div></div>
  <div id="msg" role="status"></div>
  <button id="close">Cerrar</button>
</div></div>

<script>
(function(){
window.onerror=function(m,s,l){var d=document.createElement('div');d.id='err';d.textContent='Error: '+m+' (línea '+l+')';document.body.appendChild(d)};
var COLORS=["#d9532b","#ff9a3c","#ffc83d","#fff2a8","#9ccc3c","#2f8f3a","#1fb5a8","#2fa8e0","#1e5fb4","#a65fd6","#d6a8f0","#ff7fa8","#8b5a2b","#c9a36b","#e8d3a9","#3b2a1e"];
var SIZES=[10,22,40];
var $=function(id){return document.getElementById(id)};
var paint=$('paint'),art=$('art'),stage=$('stage'),center=$('center');
var pc=paint.getContext('2d'),ac=art.getContext('2d');
var W=800,H=600,mask=null,tool='brush',color=COLORS[0],size=SIZES[1],drawing=false,last=null,undoStack=[];

// ---- tamaño de la interfaz y del dibujo (sin scroll) ----
function layout(){
  var h=window.innerHeight;
  document.documentElement.style.setProperty('--u',(h/100)+'px');
  $('app').style.height=h+'px';
  var aw=center.clientWidth-8,ah=center.clientHeight-8,k=Math.min(aw/W,ah/H);
  if(k>0){stage.style.width=Math.floor(W*k)+'px';stage.style.height=Math.floor(H*k)+'px'}
}
window.addEventListener('resize',layout);
window.addEventListener('orientationchange',function(){setTimeout(layout,250)});

// ---- paleta ----
var swEls=[];
COLORS.forEach(function(c,i){
  var b=document.createElement('button');b.className='sw'+(c===color?' on':'');b.style.background=c;b.setAttribute('aria-label','Color '+(i+1));
  b.onclick=function(){color=c;swEls.forEach(function(s){s.classList.remove('on')});b.classList.add('on');if(tool==='erase')setTool('brush')};
  swEls.push(b);$(i<8?'p1':'p2').appendChild(b);
});

// ---- herramientas ----
function setTool(t){tool=t;['brush','fill','erase'].forEach(function(n){$('t-'+n).classList.toggle('on',n===t)})}
$('t-brush').onclick=function(){setTool('brush')};
$('t-fill').onclick=function(){setTool('fill')};
$('t-erase').onclick=function(){setTool('erase')};
var szEls=[];
SIZES.forEach(function(s,i){
  var b=document.createElement('button');b.className='sz'+(s===size?' on':'');b.setAttribute('aria-label','Grosor '+(i+1));
  var d=document.createElement('i');var px=(2.2+i*1.8);d.style.width=d.style.height='calc(var(--u)*'+px+')';b.appendChild(d);
  b.onclick=function(){size=s;szEls.forEach(function(e){e.classList.remove('on')});b.classList.add('on');if(tool==='fill')setTool('brush')};
  szEls.push(b);$('sizes').appendChild(b);
});

// ---- cargar imagen ----
function say(t){$('msg').textContent=t||''}
function loadSource(src,w,h){
  var k=Math.min(1,900/Math.max(w,h));W=Math.round(w*k);H=Math.round(h*k);
  paint.width=art.width=W;paint.height=art.height=H;layout();
  var t=document.createElement('canvas');t.width=W;t.height=H;var tc=t.getContext('2d');
  tc.fillStyle='#fff';tc.fillRect(0,0,W,H);tc.drawImage(src,0,0,W,H);
  var d=tc.getImageData(0,0,W,H),p=d.data;mask=new Uint8Array(W*H);
  for(var i=0;i<W*H;i++){
    var l=0.299*p[i*4]+0.587*p[i*4+1]+0.114*p[i*4+2];
    var a=Math.max(0,Math.min(255,(255-l)*1.3));
    p[i*4]=p[i*4+1]=p[i*4+2]=0;p[i*4+3]=a;mask[i]=a>110?1:0;
  }
  ac.putImageData(d,0,0);
  pc.fillStyle='#fff';pc.fillRect(0,0,W,H);undoStack=[];
}

// ---- selector: galería / dibujos por defecto ----
function openPick(){say('');$('menu').style.display='flex';$('defs').classList.remove('show');$('pick').classList.add('open')}
function closePick(){$('pick').classList.remove('open')}
$('open').onclick=openPick;
$('close').onclick=closePick;
$('pick').addEventListener('touchmove',function(e){e.stopPropagation()});

// Galería
$('o-gal').onclick=function(){$('file').click()};
$('file').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;say('Cargando imagen…');
  var r=new FileReader();
  r.onerror=function(){say('No se pudo leer el archivo.')};
  r.onload=function(){var img=new Image();
    img.onload=function(){loadSource(img,img.naturalWidth,img.naturalHeight);say('');closePick()};
    img.onerror=function(){say('Archivo no compatible. Prueba con PNG o JPG.')};
    img.src=r.result};
  r.readAsDataURL(f);e.target.value='';
});

// Dibujo de respaldo: solo se usa si no se encuentra la carpeta sources/
function O(x,cx,cy,r){x.beginPath();x.arc(cx,cy,r,0,7);x.stroke()}
function L(x,pts,close){x.beginPath();x.moveTo(pts[0],pts[1]);for(var i=2;i<pts.length;i+=2)x.lineTo(pts[i],pts[i+1]);if(close)x.closePath();x.stroke()}
var DEFAULTS=[
 {name:'Casa',draw:function(x){
  O(x,660,110,60);for(var i=0;i<12;i++){var a=i*Math.PI/6;L(x,[660+Math.cos(a)*78,110+Math.sin(a)*78,660+Math.cos(a)*108,110+Math.sin(a)*108])}
  x.strokeRect(220,300,280,220);L(x,[195,300,360,170,525,300],true);x.strokeRect(325,400,70,120);x.strokeRect(250,340,60,60);x.strokeRect(420,340,60,60);
  x.strokeRect(630,400,24,120);O(x,642,370,50);O(x,600,400,38);O(x,685,405,38);L(x,[0,520,800,520]);O(x,90,100,28);O(x,125,92,34);O(x,160,102,26);L(x,[75,126,175,126])}}
];
function render(def){
  var c=document.createElement('canvas');c.width=800;c.height=600;var x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,800,600);x.strokeStyle='#000';x.lineWidth=8;x.lineJoin=x.lineCap='round';
  def.draw(x);return c;
}
// ---- dibujos por defecto: se leen de la carpeta sources/ (junto a esta página) ----
// Lista de ficheros: sources/index.json (['casa.png','pez.png'] o {"files":[{"file":"casa.png","name":"Casa"}]}).
// Si no existe, se intenta leer el listado de la carpeta (solo funciona si el servidor lo permite).
var SRC_DIR='sources/',EXT=/\.(png|jpe?g|gif|webp|bmp)$/i,noSources=false;
function nameOf(f){return f.replace(EXT,'').replace(/[_-]+/g,' ')}
function listSources(cb){
  fetch(SRC_DIR+'index.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()})
  .then(function(j){cb((j.files||j).map(function(it){return typeof it==='string'?{file:it,name:nameOf(it)}:{file:it.file,name:it.name||nameOf(it.file)}}))})
  .catch(function(){
    fetch(SRC_DIR).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
      var out=[],seen={},re=/href="([^"?#]+)"/gi,m;
      while((m=re.exec(t))){var f=decodeURIComponent(m[1]).split('/').pop();if(EXT.test(f)&&!seen[f]){seen[f]=1;out.push({file:f,name:nameOf(f)})}}
      cb(out)}).catch(function(){cb([])});
  });
}
function openSource(it,quiet){
  var img=new Image();
  img.onload=function(){loadSource(img,img.naturalWidth,img.naturalHeight);if(!quiet)closePick()};
  img.onerror=function(){say('No se pudo abrir '+it.file)};
  img.src=SRC_DIR+encodeURIComponent(it.file);
}
function addCard(el,name,fn){
  var b=document.createElement('button');b.className='def';b.appendChild(el);
  var n=document.createElement('div');n.textContent=name;b.appendChild(n);b.onclick=fn;$('grid').appendChild(b);
}
function loadSources(){
  listSources(function(items){
    $('grid').innerHTML='';
    if(items.length){
      items.forEach(function(it){
        var im=new Image();im.src=SRC_DIR+encodeURIComponent(it.file);im.alt=it.name;
        addCard(im,it.name,function(){openSource(it)});
      });
      openSource(items[0],true);
    }else{
      noSources=true;
      addCard(render(DEFAULTS[0]),DEFAULTS[0].name,function(){loadSource(render(DEFAULTS[0]),800,600);closePick()});
    }
  });
}
$('o-def').onclick=function(){say(noSources?'No se encontró la carpeta "sources". Se muestra el dibujo de respaldo.':'');$('menu').style.display='none';$('defs').classList.add('show')};

// ---- pintar (táctil y ratón) ----
function pos(e){var r=paint.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function pt(e){var t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;return pos(t)}
function snap(){undoStack.push(pc.getImageData(0,0,W,H));if(undoStack.length>25)undoStack.shift()}
function start(e){if(!mask)return;e.preventDefault();var p=pt(e);snap();
  if(tool==='fill'){fill(Math.floor(p.x),Math.floor(p.y));return}
  drawing=true;last=p;stroke(p,p)}
function move(e){if(!drawing)return;e.preventDefault();var p=pt(e);stroke(last,p);last=p}
function end(){drawing=false}
paint.addEventListener('touchstart',start,{passive:false});
paint.addEventListener('touchmove',move,{passive:false});
paint.addEventListener('touchend',end);paint.addEventListener('touchcancel',end);
paint.addEventListener('mousedown',start);
window.addEventListener('mousemove',move);window.addEventListener('mouseup',end);
document.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
function stroke(a,b){
  pc.strokeStyle=tool==='erase'?'#fff':color;pc.lineWidth=size*W/900+2;pc.lineCap=pc.lineJoin='round';
  pc.beginPath();pc.moveTo(a.x,a.y);pc.lineTo(b.x+0.01,b.y);pc.stroke();
}

// ---- bote de pintura ----
function fill(sx,sy){
  if(sx<0||sy<0||sx>=W||sy>=H||mask[sy*W+sx])return;
  var d=pc.getImageData(0,0,W,H),u=new Uint32Array(d.data.buffer);
  var n=parseInt(color.slice(1),16),val=(255<<24)|((n&255)<<16)|(((n>>8)&255)<<8)|(n>>16);
  var seen=new Uint8Array(W*H),st=[sy*W+sx];seen[st[0]]=1;
  while(st.length){
    var i=st.pop();u[i]=val;var x=i%W;
    if(x>0&&!seen[i-1]&&!mask[i-1]){seen[i-1]=1;st.push(i-1)}
    if(x<W-1&&!seen[i+1]&&!mask[i+1]){seen[i+1]=1;st.push(i+1)}
    if(i>=W&&!seen[i-W]&&!mask[i-W]){seen[i-W]=1;st.push(i-W)}
    if(i<W*(H-1)&&!seen[i+W]&&!mask[i+W]){seen[i+W]=1;st.push(i+W)}
  }
  pc.putImageData(d,0,0);
}
$('undo').onclick=function(){var s=undoStack.pop();if(s)pc.putImageData(s,0,0)};

layout();loadSource(render(DEFAULTS[0]),800,600);loadSources();
})();
</script>
</body>
</html>
